name: images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  challenge-miner:
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.4.1-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y --no-install-recommends make
      - run: make -C challenge miner
      - uses: actions/upload-artifact@v4
        with:
          name: libmtchallenge
          path: challenge/build/libmtchallenge.so
          if-no-files-found: error

  library-release:
    needs: challenge-miner
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: libmtchallenge
          path: build
      - run: sha256sum build/libmtchallenge.so | cut -d' ' -f1 > build/libmtchallenge.so.sha256
      - run: gh release create "${GITHUB_REF_NAME}" build/libmtchallenge.so build/libmtchallenge.so.sha256 --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --notes "rig challenge library ${GITHUB_REF_NAME}" || gh release upload "${GITHUB_REF_NAME}" build/libmtchallenge.so build/libmtchallenge.so.sha256 --repo "${GITHUB_REPOSITORY}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  agent-image:
    needs: challenge-miner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: libmtchallenge
          path: challenge/build
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: agent/deploy/Dockerfile
          push: true
          build-args: |
            CHALLENGE_LIBRARY=challenge/build/libmtchallenge.so
          tags: |
            ghcr.io/microtensor-io/rig-agent:${{ github.sha }}
            ghcr.io/microtensor-io/rig-agent:latest
      - run: |
          echo "## rig-agent image" >> "$GITHUB_STEP_SUMMARY"
          echo "digest: ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "sign it with: compute-validator sign-release ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

  validator-image:
    needs: challenge-miner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: libmtchallenge
          path: challenge/build
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: validator/deploy/Dockerfile
          push: true
          build-args: |
            CHALLENGE_LIBRARY=challenge/build/libmtchallenge.so
          tags: |
            ghcr.io/microtensor-io/compute-validator:${{ github.sha }}
            ghcr.io/microtensor-io/compute-validator:latest
      - run: |
          echo "## compute-validator image" >> "$GITHUB_STEP_SUMMARY"
          echo "digest: ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
