services:
  validator:
    image: ghcr.io/microtensor-io/compute-validator:${VALIDATOR_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CV_WALLET_HOTKEY_FILE: /wallet/hotkey
      CV_STATE_DIR: /var/lib/compute-validator
    volumes:
      - ${CV_WALLET_HOTKEY_FILE:?path to the hotkey file on this host}:/wallet/hotkey:ro
      - validator-state:/var/lib/compute-validator
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  validator-state:
